name: Zip

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Archive folder
        uses: actions/upload-artifact@v4
        with:
          name: ukrainian-mods-translate
          path: all/
